<!doctype html>
<html lang="en" data-theme="morning">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Vault</title>
    <meta name="description" content="Privacy-first personal AI journal with memory synthesis, longitudinal reflection, and secure Firestore isolation." />
    <meta property="og:title" content="Gemini Vault" />
    <meta property="og:description" content="Privacy-first personal AI journal with memory synthesis, longitudinal reflection, and secure Firestore isolation." />
    <script>
      // Prevent theme flash: read stored preference before first paint.
      (function(){try{var t=localStorage.getItem('gemini-vault:theme');var r=t==='night'?'night':t==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches?'night':'morning';document.documentElement.setAttribute('data-theme',r)}catch(e){}})();
    </script>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
